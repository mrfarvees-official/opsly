services:
  postgres:
    image: postgres:17
    container_name: opsly-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: opsly
      POSTGRES_PASSWORD: opsly
      POSTGRES_DB: opsly

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - opsly-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsly -d opsly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opsly-postgres-data:
