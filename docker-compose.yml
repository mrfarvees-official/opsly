services:
  postgres:
    image: postgres:18
    container_name: opsly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opsly
      POSTGRES_USER: opsly
      POSTGRES_PASSWORD: opsly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
